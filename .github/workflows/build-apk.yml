name: Build Android APK (GitHub APK Maker)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release-unsigned
      create_release:
        description: 'Create GitHub Release with APK'
        required: false
        default: false
        type: boolean

permissions: write-all

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          npm install

      - name: Build Web Application
        run: |
          npx vite build

      - name: Setup Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Capacitor Android platform..."
            npx --yes @capacitor/cli add android
          fi
          echo "Syncing web assets to Android platform..."
          npx --yes @capacitor/cli sync android

      - name: Grant Execute Permission to Gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release-unsigned' }}
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "Debug APK built successfully!"

      - name: Build Unsigned Release APK
        if: ${{ github.event.inputs.build_type == 'release-unsigned' }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          echo "Release APK built successfully!"

      - name: Find and Rename APK
        run: |
          mkdir -p build-output
          echo "Locating built APK files:"
          find android/app/build/outputs/apk -name "*.apk" -type f
          find android/app/build/outputs/apk -name "*debug*.apk" -exec cp {} build-output/ShopBase-AI-v1.0-debug.apk \; 2>/dev/null || true
          find android/app/build/outputs/apk -name "*release*.apk" -exec cp {} build-output/ShopBase-AI-v1.0-release.apk \; 2>/dev/null || true
          ls -la build-output/

      - name: Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ShopBase-AI-Android-APK
          path: build-output/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_release == true || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*.apk
          name: Release ${{ github.ref_name }}
          body: |
            ## 📱 ShopBase AI - Android APK Release
            
            This Android APK was automatically compiled via **GitHub Actions APK Maker**.
            
            ### Installation Instructions:
            1. Download `ShopBase-AI-v1.0-debug.apk` below.
            2. Transfer to or open directly on your Android device.
            3. Tap on the file and choose "Install".
            4. If prompted, enable "Install from Unknown Sources".
            5. Enjoy ShopBase AI Social Media Automation on your phone!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
