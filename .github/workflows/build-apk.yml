name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release-unsigned

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Web Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android

      - name: Grant Execute Permission to Gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build Android Debug APK
        if: ${{ github.event.inputs.build_type != 'release-unsigned' }}
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Android Release APK
        if: ${{ github.event.inputs.build_type == 'release-unsigned' }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect Built APKs
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk -name "*.apk" -type f -exec cp {} build-output/ \; 2>/dev/null || true
          ls -la build-output/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AmarShop-BD-Android-APK
          path: build-output/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

